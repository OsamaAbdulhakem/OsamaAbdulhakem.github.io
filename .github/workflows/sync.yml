name: sync-site
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch site
        run: |
          pip install cryptography
          cat > fetch.py <<'PY'
          import re, subprocess, os
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes
          B = "https://osama.free.nf"
          UA = "Mozilla/5.0"
          def get(url, ck=None):
              cmd = ["curl", "-sL", "-m", "90", "-A", UA]
              if ck:
                  cmd += ["-H", "Cookie: __test=" + ck]
              return subprocess.run(cmd + [url], capture_output=True).stdout
          t = get(B + "/").decode()
          a, b, c = [bytes.fromhex(x) for x in re.findall(r'toNumbers\("([0-9a-f]+)"\)', t)[:3]]
          d = Cipher(algorithms.AES(a), modes.CBC(b)).decryptor()
          ck = (d.update(c) + d.finalize()).hex()
          html = get(B + "/?i=1", ck)
          assert b"<!DOCTYPE html>" in html[:100], html[:200]
          open("index.html", "wb").write(html)
          paths = sorted(set(re.findall(r"/assets/[A-Za-z0-9_./%-]+\.[a-z0-9]+", html.decode())))
          for p in paths:
              data = get(B + p + "?i=1", ck)
              if data[:5] == b"<html" or data[:3] == b"404" or len(data) < 100:
                  print("skip", p)
                  continue
              os.makedirs("." + os.path.dirname(p), exist_ok=True)
              open("." + p, "wb").write(data)
          print(len(paths), "paths")
          PY
          python fetch.py
          rm fetch.py
          touch .nojekyll
      - name: commit
        run: |
          git config user.name "Osama Abdelhakem"
          git config user.email "OsamaAbdulhakem@users.noreply.github.com"
          git add -A
          git commit -m "Add site files" || exit 0
          git push
